<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transcription Loader</title>
    <style>
      :root {
        --bg: oklch(0.93 0.02 82);
        --panel: oklch(0.97 0.015 85);
        --ink: oklch(0.17 0.02 50);
        --wood: oklch(0.79 0.04 90);
        --geisha-robe: oklch(0.32 0.09 340);
        --samurai-robe: oklch(0.30 0.035 260);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        font-family: Arial, sans-serif;
      }

      .frame {
        width: min(60vw, 200px);
        height: min(60vw, 200px);
        border-radius: 14px;
        overflow: hidden;
        background: var(--bg);
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.15);
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .variant {
        display: none;
        opacity: 0;
      }

      .variant.active {
        display: block;
        animation: fadeIn 0.25s ease forwards;
      }

      .stroke-one,
      .stroke-two {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }

      .stroke-one {
        animation: stroke1Draw 2.8s linear infinite;
      }

      .stroke-two {
        animation: stroke2Draw 2.8s linear infinite;
      }

      .brush {
        transform-box: fill-box;
        transform-origin: center;
        animation: brushArm 2.1s ease-in-out infinite;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes brushArm {
        0%   { transform: rotate(-9deg) translate(-6px, -4px); }
        8%   { transform: rotate(-4deg) translate(-2px, -2px); }
        15%  { transform: rotate(2deg) translate(0, 0); }
        30%  { transform: rotate(11deg) translate(6px, 3px); }
        45%  { transform: rotate(4deg) translate(2px, 1px); }
        55%  { transform: rotate(-3deg) translate(-4px, -1px); }
        70%  { transform: rotate(9deg) translate(5px, 4px); }
        85%  { transform: rotate(4deg) translate(1px, 1px); }
        100% { transform: rotate(-9deg) translate(-6px, -4px); }
      }

      @keyframes stroke1Draw {
        0%   { stroke-dashoffset: 1; opacity: 0; }
        11%  { stroke-dashoffset: 1; opacity: 1; }
        45%  { stroke-dashoffset: 0; opacity: 1; }
        88%  { stroke-dashoffset: 0; opacity: 1; }
        97%  { opacity: 0; }
        100% { stroke-dashoffset: 1; opacity: 0; }
      }

      @keyframes stroke2Draw {
        0%   { stroke-dashoffset: 1; opacity: 0; }
        50%  { stroke-dashoffset: 1; opacity: 0; }
        53%  { stroke-dashoffset: 1; opacity: 1; }
        85%  { stroke-dashoffset: 0; opacity: 1; }
        90%  { stroke-dashoffset: 0; opacity: 1; }
        97%  { opacity: 0; }
        100% { stroke-dashoffset: 1; opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loading animation">
        <g class="variant geisha active">
          <rect x="0" y="0" width="200" height="172" fill="oklch(0.93 0.02 82)"/>
          <rect x="0" y="172" width="200" height="28" fill="oklch(0.79 0.04 90)"/>
          <line x1="20" y1="172" x2="20" y2="200" stroke="oklch(0.68 0.04 85)" stroke-width="1.5" opacity="0.6"/>
          <line x1="55" y1="172" x2="55" y2="200" stroke="oklch(0.68 0.04 85)" stroke-width="1.5" opacity="0.6"/>
          <line x1="145" y1="172" x2="145" y2="200" stroke="oklch(0.68 0.04 85)" stroke-width="1.5" opacity="0.6"/>
          <line x1="180" y1="172" x2="180" y2="200" stroke="oklch(0.68 0.04 85)" stroke-width="1.5" opacity="0.6"/>

          <rect x="10" y="16" width="34" height="30" rx="2" fill="oklch(0.9 0.025 85)" stroke="oklch(0.55 0.02 70)" stroke-width="1" opacity="0.85"/>
          <line x1="27" y1="16" x2="27" y2="46" stroke="oklch(0.55 0.02 70)" stroke-width="1" opacity="0.5"/>
          <line x1="10" y1="31" x2="44" y2="31" stroke="oklch(0.55 0.02 70)" stroke-width="1" opacity="0.5"/>

          <rect x="94" y="9" width="74" height="8" rx="3" fill="oklch(0.45 0.055 45)"/>
          <line x1="105" y1="17" x2="105" y2="24" stroke="oklch(0.4 0.03 45)" stroke-width="1.5"/>
          <line x1="157" y1="17" x2="157" y2="24" stroke="oklch(0.4 0.03 45)" stroke-width="1.5"/>
          <rect x="103" y="18" width="64" height="112" rx="2" fill="oklch(0.97 0.015 85)" stroke="oklch(0.72 0.02 70)" stroke-width="1"/>
          <rect x="94" y="130" width="74" height="7" rx="3" fill="oklch(0.45 0.055 45)"/>

          <path d="M112,32 C118,45 107,58 115,72 C121,84 111,96 117,108" fill="none" stroke="oklch(0.17 0.02 50)" stroke-width="2.2" stroke-linecap="round" path-length="1" class="stroke-one"/>
          <path d="M132,30 C137,42 129,54 135,66 C140,78 131,90 136,100" fill="none" stroke="oklch(0.17 0.02 50)" stroke-width="2.2" stroke-linecap="round" path-length="1" class="stroke-two"/>

          <polygon points="47,96 103,96 115,166 35,166" fill="oklch(0.32 0.09 340)"/>
          <rect x="65" y="60" width="20" height="12" rx="4" fill="oklch(0.76 0.03 50)"/>
          <circle cx="75" cy="76" r="21" fill="oklch(0.17 0.02 50)"/>
          <ellipse cx="75" cy="55" rx="16" ry="8.5" fill="oklch(0.17 0.02 50)"/>
          <circle cx="88" cy="54" r="2.6" fill="oklch(0.78 0.09 85)"/>
          <rect x="50" y="131" width="50" height="10" fill="oklch(0.8 0.09 85)"/>
          <polygon points="95,131 108,136 95,142" fill="oklch(0.8 0.09 85)"/>

          <g class="brush" transform-box="view-box" transform-origin="103px 103px">
            <path d="M103,103 Q108,84 118,64" fill="none" stroke="oklch(0.32 0.09 340)" stroke-width="9" stroke-linecap="round"/>
            <circle cx="118" cy="64" r="4.5" fill="oklch(0.76 0.03 50)"/>
            <line x1="118" y1="64" x2="124" y2="56" stroke="oklch(0.3 0.02 50)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="118" y1="64" x2="123" y2="58" stroke="oklch(0.17 0.02 50)" stroke-width="2" stroke-linecap="round"/>
          </g>
        </g>

        <g class="variant samurai">
          <rect x="0" y="0" width="200" height="172" fill="oklch(0.93 0.02 82)"/>
          <rect x="0" y="172" width="200" height="28" fill="oklch(0.79 0.04 90)"/>
          <line x1="20" y1="172" x2="20" y2="200" stroke="oklch(0.68 0.04 85)" stroke-width="1.5" opacity="0.6"/>
          <line x1="55" y1="172" x2="55" y2="200" stroke="oklch(0.68 0.04 85)" stroke-width="1.5" opacity="0.6"/>
          <line x1="145" y1="172" x2="145" y2="200" stroke="oklch(0.68 0.04 85)" stroke-width="1.5" opacity="0.6"/>
          <line x1="180" y1="172" x2="180" y2="200" stroke="oklch(0.68 0.04 85)" stroke-width="1.5" opacity="0.6"/>

          <rect x="10" y="16" width="34" height="30" rx="2" fill="oklch(0.9 0.025 85)" stroke="oklch(0.55 0.02 70)" stroke-width="1" opacity="0.85"/>
          <line x1="27" y1="16" x2="27" y2="46" stroke="oklch(0.55 0.02 70)" stroke-width="1" opacity="0.5"/>
          <line x1="10" y1="31" x2="44" y2="31" stroke="oklch(0.55 0.02 70)" stroke-width="1" opacity="0.5"/>

          <rect x="94" y="9" width="74" height="8" rx="3" fill="oklch(0.45 0.055 45)"/>
          <line x1="105" y1="17" x2="105" y2="24" stroke="oklch(0.4 0.03 45)" stroke-width="1.5"/>
          <line x1="157" y1="17" x2="157" y2="24" stroke="oklch(0.4 0.03 45)" stroke-width="1.5"/>
          <rect x="103" y="18" width="64" height="112" rx="2" fill="oklch(0.97 0.015 85)" stroke="oklch(0.72 0.02 70)" stroke-width="1"/>
          <rect x="94" y="130" width="74" height="7" rx="3" fill="oklch(0.45 0.055 45)"/>

          <path d="M112,32 C118,45 107,58 115,72 C121,84 111,96 117,108" fill="none" stroke="oklch(0.17 0.02 50)" stroke-width="2.2" stroke-linecap="round" path-length="1" class="stroke-one"/>
          <path d="M132,30 C137,42 129,54 135,66 C140,78 131,90 136,100" fill="none" stroke="oklch(0.17 0.02 50)" stroke-width="2.2" stroke-linecap="round" path-length="1" class="stroke-two"/>

          <polygon points="47,96 103,96 115,166 35,166" fill="oklch(0.30 0.035 260)"/>
          <rect x="65" y="60" width="20" height="12" rx="4" fill="oklch(0.76 0.03 50)"/>
          <circle cx="75" cy="76" r="21" fill="oklch(0.17 0.02 50)"/>
          <rect x="68" y="49" width="14" height="6" rx="2" fill="oklch(0.17 0.02 50)"/>
          <ellipse cx="75" cy="45" rx="7" ry="4.5" fill="oklch(0.17 0.02 50)"/>
          <line x1="37" y1="118" x2="28" y2="150" stroke="oklch(0.55 0.01 90)" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="37" cy="117" r="3" fill="oklch(0.25 0.02 30)"/>

          <g class="brush" transform-box="view-box" transform-origin="103px 103px">
            <path d="M103,103 Q108,84 118,64" fill="none" stroke="oklch(0.30 0.035 260)" stroke-width="9" stroke-linecap="round"/>
            <circle cx="118" cy="64" r="4.5" fill="oklch(0.76 0.03 50)"/>
            <line x1="118" y1="64" x2="124" y2="56" stroke="oklch(0.3 0.02 50)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="118" y1="64" x2="123" y2="58" stroke="oklch(0.17 0.02 50)" stroke-width="2" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
    </div>

    <script>
      (() => {
        const geisha = document.querySelector('.geisha');
        const samurai = document.querySelector('.samurai');
        const isSamurai = Math.random() >= 0.5;
        geisha.classList.toggle('active', !isSamurai);
        samurai.classList.toggle('active', isSamurai);
      })();
    </script>
  </body>
</html>
